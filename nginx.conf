# empregol-web — nginx servindo a SPA.
# TLS termina no edge da Cloudflare; Traefik entrega HTTP aqui na porta 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança básicos.
    # CSP ficou de fora de propósito: a home usa estilos inline do React e
    # fontes do Google — uma policy mal calibrada quebraria o layout em produção.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck do container e do Uptime Kuma.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome — podem ser cacheados para sempre.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca em cache, senão um deploy novo não aparece para quem
    # já visitou o site. add_header não é herdado quando o bloco define os seus.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router resolve).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
