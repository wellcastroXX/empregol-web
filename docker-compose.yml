# Projeto separado do backend (`name: empregol`) de propósito: um `docker compose
# down` aqui nunca pode derrubar a API nem o banco.
name: empregol-web

services:
  web:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-empregol}
        VITE_API_URL: ${VITE_API_URL:-https://api.empregolstartup.com.br}
    image: empregol-web
    container_name: empregol-web
    restart: unless-stopped
    networks:
      - proxy
    labels:
      # Publicação via Traefik + Cloudflare Tunnel (TLS no edge, HTTP no entrypoint web)
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.empregol-web.entrypoints=web'
      - 'traefik.http.routers.empregol-web.rule=Host(`${WEB_DOMAIN:-empregolstartup.com.br}`) || Host(`${WEB_DOMAIN_WWW:-www.empregolstartup.com.br}`)'
      - 'traefik.http.services.empregol-web.loadbalancer.server.port=80'

networks:
  proxy:
    external: true
